# 开屏广告拦截 — Clash Rule Provider (classical)
# 从 iPhone Surge 模块 splash-ad-blocker.sgmodule 提取的「整域拦截」子集
# 仅含 DOMAIN 类纯广告域，可在路由器/网关 Clash 对全屋设备生效
# 注意：B站等需要 MITM 按路径拦的开屏，Clash 做不到，未包含（仅含 cm.bilibili.com 商业广告域）
# 引用方式：rules 里 - RULE-SET,splash-ad-reject,REJECT
payload:
  # === 通用第三方广告 SDK（穿山甲 / 广点通GDT / 阿里tanx）===
  - DOMAIN-KEYWORD,pangolin-sdk-toutiao
  - DOMAIN-SUFFIX,pglstatp-toutiao.com
  - DOMAIN-SUFFIX,gdt.qq.com
  - DOMAIN-SUFFIX,l.qq.com
  - DOMAIN-SUFFIX,e.qq.com
  - DOMAIN-SUFFIX,ugdtimg.com
  - DOMAIN-SUFFIX,pgdt.gtimg.cn
  - DOMAIN-SUFFIX,gdtimg.com
  - DOMAIN-SUFFIX,tanx.com
  - DOMAIN-SUFFIX,alimama.com
  - DOMAIN-SUFFIX,mmstat.com
  # === 通用广告中介 SDK / ADX 交易所 ===
  - DOMAIN-SUFFIX,yunxish.com
  - DOMAIN-SUFFIX,iggrowth.cn
  - DOMAIN-SUFFIX,mentamob.com
  - DOMAIN-SUFFIX,66mobi.com
  - DOMAIN-SUFFIX,hubcloud.com.cn
  - DOMAIN-SUFFIX,beizi.biz
  - DOMAIN-SUFFIX,zhangyuyidong.cn
  - DOMAIN-SUFFIX,adwangmai.com
  - DOMAIN-SUFFIX,ubixioe.com
  - DOMAIN-SUFFIX,vlion.cn
  - DOMAIN-SUFFIX,halomobi.com
  - DOMAIN-SUFFIX,adinall.com
  - DOMAIN-SUFFIX,adkwai.com
  # === 广告专属子域（父域是正常业务，只拦广告子域）===
  - DOMAIN,afd.baidu.com
  - DOMAIN,afdconf.baidu.com
  - DOMAIN-SUFFIX,rmb.bdstatic.com
  - DOMAIN,impdsp.meituan.com
  - DOMAIN,adx.ys7.com
  # === UC 浏览器 ===
  - DOMAIN-SUFFIX,1rtb.net
  - DOMAIN-SUFFIX,e.kuaishou.com
  - DOMAIN-SUFFIX,e.kuaishou.cn
  - DOMAIN-SUFFIX,58iclick.com
  - DOMAIN,dsp-x.jd.com
  - DOMAIN,mobads.baidu.com
  - DOMAIN,mobads-logs.baidu.com
  - DOMAIN,ssp-sdk-config.uc.cn
  # === bilibili（仅商业广告域；开屏 splash 需 MITM，Clash 无法处理）===
  - DOMAIN,cm.bilibili.com
  # === 12306（开屏打车广告专用域）===
  - DOMAIN,ad.12306.cn
  # === 酷狗音乐（腾讯音乐广告 + 自家 acshow 广告展示各地区变体）===
  - DOMAIN,tmeadcomm.y.qq.com
  - DOMAIN-KEYWORD,acshow
  - DOMAIN,adserviceretry.kugou.com
  - DOMAIN,adservice.kugou.com
  # === 央视新闻（CMG 中央广播电视总台广告交易所 ADX）===
  - DOMAIN-SUFFIX,cmgadx.com
